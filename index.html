<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WAVE — AI MC 忘年会</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ink:#eef0ff;
    --dim:rgba(238,240,255,.55);
    --gold:#d9b45b;
    --gold2:#e8c97a;
  }
  html,body{height:100%;}
  body{
    margin:0;
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,-apple-system,sans-serif;
    background:#070812;
    min-height:100dvh;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(900px 620px at 85% -5%, rgba(99,91,255,.35), transparent 60%),
      radial-gradient(820px 620px at -10% 105%, rgba(30,90,200,.30), transparent 62%),
      radial-gradient(600px 400px at 50% 120%, rgba(217,180,91,.10), transparent 65%),
      linear-gradient(#070812,#0a0b1e);
  }
  [hidden]{display:none !important;}
  button{font-family:inherit;}

  /* ---------- 共通: 接続状態ピル ---------- */
  .status-pill{
    display:inline-flex; gap:8px; align-items:center;
    font-size:13px; color:var(--dim);
    background:rgba(255,255,255,.05);
    padding:6px 12px; border-radius:999px;
    border:1px solid rgba(255,255,255,.08);
  }
  .dot{width:9px; height:9px; border-radius:50%; background:#f5b942; flex:none;}
  .dot.live{background:#3ddc84; box-shadow:0 0 10px rgba(61,220,132,.85);}
  .dot.reconnecting{background:#ff6b5e;}

  /* ---------- 参加者モード ---------- */
  main#participant{
    min-height:100dvh; display:flex; flex-direction:column;
    width:100%; max-width:560px; margin:0 auto; box-sizing:border-box;
    padding:calc(12px + env(safe-area-inset-top)) 18px calc(14px + env(safe-area-inset-bottom));
  }
  .topbar{display:flex; justify-content:space-between; align-items:center;}
  .brand{color:var(--gold2); font-size:13px; letter-spacing:.14em; font-weight:600;}
  .party-line{text-align:center; color:var(--gold2); opacity:.85; font-size:12.5px; font-weight:600; letter-spacing:.08em; margin-top:10px;}
  .screen-sub{color:var(--dim); font-size:clamp(13px,1.4vw,18px); letter-spacing:.22em; margin-top:6px;}

  /* ---------- ニックネーム ---------- */
  #nickGate{margin-top:16px;}
  .nick-card{
    padding:18px; border-radius:18px; text-align:center;
    background:rgba(255,255,255,.05); border:1px solid rgba(217,180,91,.45);
  }
  .nick-label{font-size:16px; font-weight:700; color:var(--gold2); margin-bottom:12px; letter-spacing:.05em;}
  #nickForm{display:flex; gap:10px;}
  #nickInput{
    flex:1; min-width:0; font-size:16px; padding:12px 16px; border-radius:999px;
    border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.06);
    color:var(--ink); outline:none;
  }
  #nickInput:focus{border-color:rgba(217,180,91,.7);}
  #nickInput::placeholder{color:rgba(238,240,255,.35);}
  #nickJoin{
    padding:0 20px; border-radius:999px; border:none; cursor:pointer;
    background:linear-gradient(180deg,#e8c97a,#c49b3f);
    color:#241c04; font-weight:700; font-size:15px;
  }
  .nick-bar{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-top:12px; font-size:13px; color:var(--dim);
  }
  .nick-bar b{color:var(--gold2);}
  #nickChange{
    background:none; border:1px solid rgba(255,255,255,.25); color:var(--dim);
    font-size:12px; padding:4px 12px; border-radius:999px; cursor:pointer;
  }
  .chip-name{font-size:11px; font-weight:600; letter-spacing:.04em; color:var(--gold2); opacity:.9;}
  .chip.mine .chip-name{color:#ffe9a8;}
  .chip-text{overflow:hidden; text-overflow:ellipsis;}
  .wall-name{
    display:block; font-size:.36em; font-weight:600; letter-spacing:.16em;
    opacity:.85; margin-bottom:.15em;
  }
  .count-block{text-align:center; margin-top:4vh;}
  .count-num{
    font-size:clamp(96px,34vw,168px); font-weight:100; line-height:1; letter-spacing:-.02em;
  }
  .count-num.pop{animation:pop .35s ease-out;}
  @keyframes pop{40%{transform:scale(1.05);}}
  .count-label{color:var(--dim); font-size:15px; letter-spacing:.3em; margin-top:2px;}
  .wave-total{margin-top:10px; color:var(--dim); font-size:13px;}
  .wave-total b, .screen-wave-total b{color:var(--gold2); font-weight:600;}
  .chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:18px 4px 4px; min-height:34px;}
  .chip{
    display:inline-flex; align-items:baseline; gap:7px;
    padding:7px 13px; border-radius:999px; font-size:14px;
    border:1px solid rgba(217,180,91,.45); color:var(--gold2);
    background:rgba(217,180,91,.08);
    max-width:78vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    animation:chipIn .45s ease-out both;
  }
  .chip.mine{background:rgba(217,180,91,.22); color:#ffe9a8; border-color:rgba(217,180,91,.85);}
  @keyframes chipIn{from{opacity:0; transform:translateY(8px) scale(.92);}}
  .wave-zone{margin-top:auto; position:relative; display:flex; flex-direction:column; align-items:center; padding:30px 0 6px;}
  #rippleLayer{position:absolute; inset:0; pointer-events:none;}
  .ripple{
    position:absolute; border-radius:50%;
    border:2px solid rgba(150,160,255,.55);
    transform:translate(-50%,-50%);
    animation:rippleAnim 1.5s ease-out forwards;
  }
  @keyframes rippleAnim{
    from{width:60px; height:60px; opacity:.9;}
    to{width:340px; height:340px; opacity:0;}
  }
  #waveBtn{
    position:relative; z-index:2; width:148px; height:148px; border-radius:50%;
    border:1px solid rgba(160,170,255,.45);
    background:radial-gradient(circle at 32% 28%, #8f8bf5, #5a54d1 55%, #34307e);
    color:#fff; cursor:pointer;
    box-shadow:0 18px 44px rgba(64,58,190,.5), inset 0 2px 14px rgba(255,255,255,.35);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  }
  #waveBtn:active{transform:scale(.96);}
  #waveBtn .wave-kanji{font-size:46px; font-weight:200; line-height:1;}
  #waveBtn .wave-sub{font-size:11px; letter-spacing:.28em; opacity:.85;}
  .wave-hint{margin-top:12px; color:var(--dim); font-size:12.5px;}
  #wordBar{display:flex; gap:10px; margin-top:14px;}
  #wordInput{
    flex:1; min-width:0; font-size:16px; padding:13px 16px; border-radius:999px;
    border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.06);
    color:var(--ink); outline:none;
  }
  #wordInput:focus{border-color:rgba(217,180,91,.7);}
  #wordInput::placeholder{color:rgba(238,240,255,.35);}
  #wordSend{
    padding:0 22px; border-radius:999px; border:none; cursor:pointer;
    background:linear-gradient(180deg,#e8c97a,#c49b3f);
    color:#241c04; font-weight:700; font-size:15px;
  }

  /* ---------- 写真（参加者） ---------- */
  .photo-bar{display:flex; align-items:center; gap:12px; margin-top:12px;}
  #photoBtn{
    padding:10px 18px; border-radius:999px; cursor:pointer;
    background:rgba(255,255,255,.06); color:var(--ink);
    border:1px solid rgba(217,180,91,.6); font-weight:600; font-size:14px;
  }
  #photoBtn:active{transform:scale(.97);}
  #photoStatus{font-size:12.5px; color:var(--dim);}
  .photos-strip{margin-top:16px;}
  .photos-label{font-size:12px; letter-spacing:.28em; color:var(--dim); margin-bottom:8px; text-align:center;}
  .photos-row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}
  .photo-thumb{
    width:56px; height:56px; object-fit:cover; border-radius:12px;
    border:1px solid rgba(255,255,255,.18);
    animation:chipIn .4s ease-out both;
  }
  .photo-thumb.mine{border-color:rgba(217,180,91,.85);}
  .master-link-row{text-align:center; margin-top:24px;}
  #masterLink{
    display:inline-block; color:var(--dim); font-size:13px; letter-spacing:.08em;
    text-decoration:none; border:1px solid rgba(255,255,255,.16);
    padding:8px 16px; border-radius:999px;
  }

  /* ---------- スクリーンモード ---------- */
  main#screen{
    min-height:100dvh; display:flex; flex-direction:column;
    padding:38px 48px; box-sizing:border-box;
  }
  .screen-head{display:flex; justify-content:space-between; align-items:flex-start;}
  .screen-title{font-size:clamp(26px,3.4vw,44px); letter-spacing:.18em; font-weight:600;}
  .screen-title .gold{color:var(--gold2);}
  .screen-count{text-align:center; margin-top:1vh;}
  .screen-count .count-num{font-size:clamp(150px,24vw,330px);}
  .screen-count .count-label{font-size:clamp(16px,2vw,26px);}
  .screen-wave-total{text-align:center; color:var(--dim); font-size:clamp(15px,1.6vw,22px); margin-top:6px;}
  #wordWall{position:relative; flex:1; overflow:hidden; margin-top:8px;}
  .wall-word{
    position:absolute; white-space:nowrap; font-weight:600;
    color:var(--gold2); text-shadow:0 4px 30px rgba(0,0,0,.55);
    animation:wallFloat 9s ease-out forwards;
  }
  .wall-word.white{color:#f2f3ff;}
  @keyframes wallFloat{
    0%{opacity:0; transform:translate(-50%,26px) scale(.9);}
    8%{opacity:1;}
    70%{opacity:.95;}
    100%{opacity:0; transform:translate(-50%,-34vh) scale(1.04);}
  }
  /* ---------- 進行パネル（スクリーン） ---------- */
  #opsToggle{
    position:fixed; left:22px; bottom:22px; z-index:45;
    background:rgba(255,255,255,.05); color:var(--dim);
    border:1px solid rgba(255,255,255,.14); border-radius:999px;
    font-size:12.5px; padding:7px 14px; cursor:pointer; letter-spacing:.1em;
  }
  #opsPanel{
    position:fixed; left:22px; bottom:64px; z-index:45; width:min(86vw,330px);
    background:rgba(10,10,26,.95); border:1px solid rgba(255,255,255,.14);
    border-radius:14px; padding:14px; box-sizing:border-box;
    box-shadow:0 16px 40px rgba(0,0,0,.5);
  }
  .ops-title{font-size:12px; letter-spacing:.2em; color:var(--dim); margin-bottom:10px;}
  .ops-row{display:flex; gap:8px; margin-bottom:8px;}
  .ops-row input{
    flex:1; min-width:0; font-size:14px; padding:9px 12px; border-radius:10px;
    border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.06);
    color:var(--ink); outline:none;
  }
  .ops-row button{
    padding:9px 14px; border-radius:10px; cursor:pointer; white-space:nowrap;
    border:1px solid rgba(217,180,91,.5); background:rgba(217,180,91,.12);
    color:var(--gold2); font-size:13px; font-weight:600;
  }
  .ops-hint{font-size:12px; color:var(--dim); min-height:1.4em;}

  #qrCard{
    position:fixed; right:30px; bottom:30px; z-index:20;
    background:#fff; color:#14142b; border-radius:18px;
    padding:16px 16px 12px; text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.5);
  }
  #qrCard .qr-label{font-size:14px; font-weight:700; margin-top:8px;}
  #qrCard .qr-url{font-size:10.5px; color:#666; word-break:break-all; max-width:190px; margin:2px auto 0;}
  #qrBox img, #qrBox canvas{display:block; margin:0 auto;}

  /* ---------- MCバナー ---------- */
  #mcBanner{
    position:fixed; top:calc(12px + env(safe-area-inset-top)); left:50%;
    transform:translateX(-50%); width:min(92vw,520px); z-index:40;
    background:linear-gradient(180deg, rgba(38,36,86,.97), rgba(22,21,54,.97));
    border:1px solid rgba(217,180,91,.55); border-radius:18px;
    padding:16px 18px; box-shadow:0 16px 44px rgba(0,0,0,.5);
    animation:bannerIn .45s cubic-bezier(.2,1.4,.4,1) both;
  }
  body.screen #mcBanner{width:min(80vw,900px); padding:26px 34px;}
  @keyframes bannerIn{from{opacity:0; transform:translate(-50%,-16px) scale(.96);}}
  #mcBanner .mc-title{color:var(--gold2); font-weight:700; font-size:15px; letter-spacing:.08em; margin-bottom:4px;}
  body.screen #mcBanner .mc-title{font-size:24px;}
  #mcBanner .mc-body{font-size:16.5px; line-height:1.65; white-space:pre-wrap;}
  body.screen #mcBanner .mc-body{font-size:30px;}
  #mcBanner .mc-close{
    position:absolute; top:8px; right:12px; background:none; border:none;
    color:var(--dim); font-size:20px; cursor:pointer; line-height:1; padding:4px;
  }

  /* ---------- 封筒コンポーネント（封印表示・配達演出で共用） ---------- */
  .envelope-el{
    --ew:250px;
    position:relative; width:var(--ew); height:calc(var(--ew)*.62);
    perspective:700px;
    filter:drop-shadow(0 24px 44px rgba(0,0,0,.55));
  }
  .env-body{
    position:absolute; inset:0; border-radius:10px;
    background:linear-gradient(160deg,#33356e,#1e2049);
    border:1px solid rgba(217,180,91,.55);
  }
  .env-fold{
    position:absolute; top:0; bottom:0; width:55%;
    background:rgba(255,255,255,.045);
  }
  .env-fold.left{left:0; clip-path:polygon(0 0,100% 50%,0 100%);}
  .env-fold.right{right:0; clip-path:polygon(100% 0,0 50%,100% 100%);}
  .env-flap{
    position:absolute; left:0; right:0; top:0; height:54%; z-index:3;
    background:linear-gradient(180deg,#3d3f7d,#2a2c58);
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top center;
  }
  .env-seal{
    position:absolute; left:50%; top:47%; z-index:4;
    width:calc(var(--ew)*.23); height:calc(var(--ew)*.23);
    transform:translate(-50%,-50%);
  }
  .seal-half{
    position:absolute; top:0; width:51%; height:100%;
    background:radial-gradient(circle at 40% 35%, #d84b3a, #a02c20);
  }
  .seal-half.left{left:0; border-radius:999px 0 0 999px;}
  .seal-half.right{right:0; border-radius:0 999px 999px 0;}
  .seal-char{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#ffe9c9; font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:calc(var(--ew)*.105);
  }

  /* ---------- 封印（選択）オーバーレイ ---------- */
  .overlay{
    position:fixed; inset:0; z-index:60;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:22px; box-sizing:border-box; text-align:center;
    background:rgba(4,4,14,.72); backdrop-filter:blur(6px);
  }
  #sealedOverlay .envelope-el{--ew:200px; animation:envFloat 3.6s ease-in-out infinite alternate;}
  body.screen #sealedOverlay .envelope-el{--ew:260px;}
  @keyframes envFloat{from{transform:translateY(0);} to{transform:translateY(-8px);}}
  .sealed-title{font-size:26px; margin:26px 0 6px; letter-spacing:.06em;}
  body.screen .sealed-title{font-size:44px;}
  .sealed-msg{color:var(--dim); font-size:15.5px; margin:0 0 26px; white-space:pre-wrap; line-height:1.7;}
  body.screen .sealed-msg{font-size:24px;}
  .sealed-btns{display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}
  .btn-gold{
    padding:14px 28px; border-radius:999px; border:none; cursor:pointer;
    background:linear-gradient(180deg,#e8c97a,#c49b3f);
    color:#241c04; font-weight:700; font-size:16px;
    box-shadow:0 12px 30px rgba(0,0,0,.45);
  }
  .btn-ghost{
    padding:14px 28px; border-radius:999px; cursor:pointer;
    background:rgba(255,255,255,.06); color:var(--ink);
    border:1px solid rgba(217,180,91,.6); font-weight:600; font-size:16px;
  }
  body.screen .btn-gold, body.screen .btn-ghost{font-size:21px; padding:18px 38px;}
  .sealed-error{color:#ff9d94; font-size:14px; margin-top:18px;}
  #sealedChip{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(86px + env(safe-area-inset-bottom)); z-index:30;
    background:linear-gradient(180deg,#e8c97a,#c49b3f); color:#241c04;
    font-weight:700; font-size:14px; padding:11px 18px; border-radius:999px;
    border:none; box-shadow:0 10px 26px rgba(0,0,0,.45); cursor:pointer;
    animation:chipIn .4s ease-out both;
  }
  body.screen #sealedChip{bottom:34px; font-size:17px; padding:14px 24px;}

  /* ---------- 年賀状カード + 配達演出 ---------- */
  #artworkOverlay{z-index:70;}
  .delivery-scene{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
  }
  #artworkOverlay .envelope-el{--ew:250px;}
  body.screen #artworkOverlay .envelope-el{--ew:360px;}
  .particles{position:absolute; inset:0; overflow:hidden;}
  .particle{
    position:absolute; bottom:16%; border-radius:50%;
    background:radial-gradient(circle,#ffe9a8,#d9a83f);
    animation-name:particleRise; animation-timing-function:ease-out; animation-fill-mode:both;
  }
  @keyframes particleRise{
    0%{opacity:0; transform:translate(0,0) scale(.6);}
    12%{opacity:1;}
    100%{opacity:0; transform:translate(var(--dx,0px),-46vh) scale(1);}
  }
  #artworkOverlay.playing .envelope-el{animation:envLife 3.2s ease-in-out both;}
  @keyframes envLife{
    0%{opacity:0; transform:translateY(46px) scale(.9);}
    12%{opacity:1; transform:translateY(0) scale(1);}
    78%{opacity:1; transform:translateY(0) scale(1);}
    94%,100%{opacity:0; transform:translateY(30px) scale(.92);}
  }
  #artworkOverlay.playing .envelope-el::after{
    content:""; position:absolute; inset:-32%; z-index:-1; border-radius:50%;
    background:radial-gradient(circle, rgba(232,201,122,.42), transparent 65%);
    animation:envGlow 3.2s ease-in-out both;
  }
  @keyframes envGlow{0%{opacity:0;} 16%{opacity:1;} 72%{opacity:.9;} 100%{opacity:0;}}
  #artworkOverlay.playing .env-seal{animation:sealPulse .42s ease-in-out .95s 2;}
  @keyframes sealPulse{
    0%,100%{transform:translate(-50%,-50%) scale(1);}
    50%{transform:translate(-50%,-50%) scale(1.13);}
  }
  #artworkOverlay.playing .seal-half.left{animation:crackL .5s ease-out 1.85s both;}
  #artworkOverlay.playing .seal-half.right{animation:crackR .5s ease-out 1.85s both;}
  @keyframes crackL{from{transform:none; opacity:1;} to{transform:translateX(-10px) rotate(-16deg); opacity:.2;}}
  @keyframes crackR{from{transform:none; opacity:1;} to{transform:translateX(10px) rotate(16deg); opacity:.2;}}
  #artworkOverlay.playing .seal-char{animation:sealCharOut .35s ease-out 1.85s both;}
  @keyframes sealCharOut{to{opacity:0; transform:scale(.5) rotate(-10deg);}}
  #artworkOverlay.playing .env-flap{animation:flapOpen .65s ease-in-out 2s both;}
  @keyframes flapOpen{from{transform:rotateX(0deg);} to{transform:rotateX(180deg);}}
  #artworkOverlay.playing #postcard{animation:cardRise 1.05s cubic-bezier(.22,1.25,.36,1) 2.3s both;}
  @keyframes cardRise{
    from{opacity:0; transform:translateY(120px) scale(.48);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  #artworkOverlay.delivered .delivery-scene{display:none;}
  #artworkOverlay.delivered #postcard{animation:none; opacity:1; transform:none;}

  #postcard{
    position:relative; z-index:2;
    width:min(92vw,430px); max-height:88dvh; overflow-y:auto;
    background:linear-gradient(170deg,#faf3df,#f3e8cd);
    color:#37312a; border-radius:6px;
    padding:30px 28px 24px; box-sizing:border-box;
    border:1px solid #c9a959;
    box-shadow:inset 0 0 0 5px #f7efdb, inset 0 0 0 6px #c9a959, 0 30px 80px rgba(0,0,0,.6);
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    text-align:center;
  }
  body.screen #postcard{width:min(92vw,860px); padding:48px 56px 40px;}
  #cardImage{width:100%; border-radius:4px; margin-bottom:18px; border:1px solid rgba(160,130,60,.4);}
  .card-photos{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:18px;}
  .card-photos img{
    width:calc(33.333% - 6px); aspect-ratio:1; object-fit:cover;
    border-radius:4px; border:1px solid rgba(160,130,60,.4);
  }
  .card-head{display:flex; align-items:center; justify-content:center; gap:14px;}
  .card-sun{width:52px; height:52px; border-radius:50%; flex:none;
    background:radial-gradient(circle at 38% 34%, #d84b3a, #a02c20);}
  body.screen .card-sun{width:76px; height:76px;}
  .card-greeting{font-size:34px; letter-spacing:.42em; margin-right:-.42em; color:#8c2f24; font-weight:600;}
  body.screen .card-greeting{font-size:54px;}
  #cardTitle{font-size:24px; margin:18px 0 6px; line-height:1.5; color:#33302a;}
  body.screen #cardTitle{font-size:40px;}
  #cardBody{font-size:16.5px; line-height:1.95; white-space:pre-wrap; text-align:left; margin-top:10px;}

<body>

<!-- ================= 参加者モード ================= -->
<main id="participant">
  <header class="topbar">
    <div class="status-pill"><span class="dot js-status-dot"></span><span class="js-status-text">接続中…</span></div>

  <div class="party-line" id="partyLine"></div>

  <section id="nickGate" hidden>
    <div class="nick-card">
      <div class="nick-label">ニックネームを決めてね</div>
      <form id="nickForm">
        <input id="nickInput" type="text" maxlength="12" placeholder="ニックネーム（12文字まで）" autocomplete="off">

  <section class="count-block">
    <div class="count-num js-presence">0</div>

  <div class="photos-strip" id="photosStrip" hidden>

    <div class="photos-row" id="photosRow"></div>

  <div class="master-link-row">

</main>

<!-- ================= スクリーンモード ================= -->
<main id="screen" hidden>
  <div class="screen-head">
    <div>
      <div class="screen-title" id="screenTitle"></div>
      <div class="screen-sub">AI MC — WAVE</div>
    </div>
    <div class="status-pill"><span class="dot js-status-dot"></span><span class="js-status-text">接続中…</span></div>
  </div>
  <div class="screen-count">
    <div class="count-num js-presence">0</div>
    <div class="count-label">人が参加中</div>

  <button id="opsToggle" type="button">進行</button>

<!-- ================= MCバナー ================= -->
<div id="mcBanner" hidden>

  <div class="mc-title" id="mcTitle"></div>

</div>

<!-- ================= 封印チップ ================= -->
<button id="sealedChip" type="button" hidden>年賀状が届いています（元日に開封）</button>

<!-- ================= 封印（選択） ================= -->
<div id="sealedOverlay" class="overlay" hidden>

</div>

<!-- ================= 年賀状（配達演出 + カード） ================= -->
<div id="artworkOverlay" class="overlay" hidden>
  <div class="delivery-scene" id="deliveryScene">
    <div class="particles" id="particles"></div>
    <div class="envelope-el">
      <div class="env-body"></div>
      <div class="env-fold left"></div>
      <div class="env-fold right"></div>
      <div class="env-flap"></div>
      <div class="env-seal"><span class="seal-half left"></span><span class="seal-half right"></span><span class="seal-char">封</span></div>
    </div>
  </div>
  <article id="postcard">
    <img id="cardImage" alt="" hidden>
    <div class="card-head"><span class="card-sun"></span><span class="card-greeting">謹賀新年</span></div>
    <h2 id="cardTitle"></h2>
    <div id="cardBody"></div>
    <div class="card-photos" id="cardPhotos" hidden></div>
    <div class="card-divider"></div>
    <div class="card-words-label" id="cardWordsLabel">みんなの言葉</div>
    <div id="cardWords"></div>
    <div class="card-foot" id="cardFoot"></div>
  </article>
  <div class="tap-hint" id="cardHint" hidden>タップで閉じる</div>
</div>

<div id="configNotice" hidden>接続設定が未完了です（キーが未設定です）</div>

<script>
(function () {
  'use strict';

  // ================= 設定 =================
  var SUPABASE_URL = 'https://yyphxcdgjlezbkfodqna.supabase.co';
  var SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_ZVwZaQHWIVR-JnpEZ189pA_BmDYwG8i';
  var CHANNEL_NAME = 'wave-room';
  var PARTY_NAME = 'Agent Forge AI Hackathon 忘年会';
  var MAX_WORDS = 30;
  var VISIBLE_CHIPS = 8;
  var PHOTOS_BUCKET = 'wave-photos';
  var MAX_PHOTOS = 12;            // 保持する写真（新しい順）
  var VISIBLE_PHOTO_THUMBS = 6;   // 参加者ストリップの表示数
  var DEFAULT_CARD_IMAGE = 'https://yyphxcdgjlezbkfodqna.supabase.co/storage/v1/object/public/wave-web/card-eto-2027.webp';

  function $(id) { return document.getElementById(id); }
  function all(sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); }

  var isScreen = new URLSearchParams(location.search).get('screen') === '1';
  if (isScreen) document.body.classList.add('screen');
  $('participant').hidden = isScreen;
  $('screen').hidden = !isScreen;

  // ================= 端末ID（ブラウザごとに1つ、Presenceのキー） =================
  var DEVICE_KEY = 'wave-device-id';
  var deviceId = null;
  try { deviceId = localStorage.getItem(DEVICE_KEY); } catch (e) { deviceId = null; }
  if (!deviceId) {
    deviceId = 'web-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    try { localStorage.setItem(DEVICE_KEY, deviceId); } catch (e) { /* 保存できなくても動く */ }
  }

  // ================= ニックネーム（端末IDと並んで localStorage に保存） =================
  var NICK_KEY = 'wave-nickname';
  var nickname = '';
  try { nickname = (localStorage.getItem(NICK_KEY) || '').trim(); } catch (e) { nickname = ''; }

  // ================= 状態 =================
  var sb = null;
  var channel = null;
  var connState = 'connecting';
  var presenceCount = 0;
  var waveCount = 0;
  var words = [];               // 新しい順 {id, text, from, name, mine}
  var wordSeq = 0;
  var photos = [];              // 新しい順 {id, url, name, mine}
  var photoSeq = 0;
  var mcTimer = null;
  var shownCardId = null;       // このページで表示済みの wave_cards 行ID
  var currentCard = null;       // 表示中のカード
  var delivered = false;        // 配達演出が完走（またはスキップ）したか
  var canDismissCard = false;
  var deliveryTimer = null;
  var pendingSealed = null;     // {message, cardId}
  var lastRemoteVibrate = 0;

  var configBad = !SUPABASE_PUBLISHABLE_KEY ||
    SUPABASE_PUBLISHABLE_KEY === 'PASTE_PUBLISHABLE_KEY_HERE' ||
    !window.supabase;
  if (configBad) $('configNotice').hidden = false;

  // ================= 表示ユーティリティ =================
  function vibrate(pattern) {
    if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) { /* noop */ } }
  }
  function remoteVibrate() {
    var now = Date.now();
    if (now - lastRemoteVibrate < 350) return;
    lastRemoteVibrate = now;
    vibrate(12);
  }
  function setConn(state) {
    connState = state;
    var label = state === 'live' ? 'ライブ' : (state === 'reconnecting' ? '再接続中…' : '接続中…');
    all('.js-status-text').forEach(function (el) { el.textContent = label; });
    all('.js-status-dot').forEach(function (el) {
      el.className = 'dot js-status-dot' + (state === 'live' ? ' live' : (state === 'reconnecting' ? ' reconnecting' : ''));
    });
  }
  function renderCounts() {
    all('.js-presence').forEach(function (el) {
      el.textContent = String(presenceCount);
      el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    });
    all('.js-wave-total').forEach(function (el) { el.textContent = String(waveCount); });
  }

  // ================= Realtime 接続 =================
  function sendBroadcast(event, payload) {
    if (!channel) return;
    try {
      var r = channel.send({ type: 'broadcast', event: event, payload: payload });
      if (r && typeof r.catch === 'function') r.catch(function () { /* noop */ });
    } catch (e) { /* noop */ }
  }

  function trackPresence() {
    if (!channel) return;
    try {
      var payload = { client_id: deviceId, joined_at: new Date().toISOString() };
      if (nickname) payload.name = nickname;   // 人数カウントはキーの数のまま不変
      var t = channel.track(payload);
      if (t && typeof t.catch === 'function') t.catch(function () { /* noop */ });
    } catch (e) { /* noop */ }
  }

  function joinRoom() {
    if (!sb) return;
    channel = sb.channel(CHANNEL_NAME, {
      config: {
        broadcast: { self: true },          // 自分の送信も自分で受け取る（アプリと同じ）
        presence: { key: deviceId }         // 端末ごとに1カウント
      }
    });
    channel
      .on('presence', { event: 'sync' }, function () {
        var st = channel.presenceState();
        presenceCount = Object.keys(st).length;
        renderCounts();
      })
      .on('broadcast', { event: 'wave' }, function (m) { onWave(m.payload); })
      .on('broadcast', { event: 'word' }, function (m) { onWord(m.payload); })
      .on('broadcast', { event: 'mc' }, function (m) { onMc(m.payload); })
      .on('broadcast', { event: 'sealed' }, function (m) { onSealed(m.payload); })
      .on('broadcast', { event: 'artwork' }, function (m) { onArtwork(m.payload); })
      .on('broadcast', { event: 'photo' }, function (m) { onPhoto(m.payload); })
      .subscribe(function (status) {
        if (status === 'SUBSCRIBED') {
          setConn('live');
          // 再接続のたびに Presence を張り直す
          trackPresence();
        } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
          setConn('reconnecting');
        }
      });
  }

  function rejoin() {
    if (!sb) return;
    var old = channel;
    channel = null;
    setConn('connecting');
    var done = function () { joinRoom(); };
    if (old) {
      try {
        var p = sb.removeChannel(old);
        if (p && typeof p.then === 'function') { p.then(done, done); return; }
      } catch (e) { /* noop */ }
    }
    done();
  }

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    fetchCardFromDb();                    // 年賀状の開封チェック（アプリの復帰時と同じ）
    if (connState !== 'live') rejoin();
  });
  window.addEventListener('online', function () {
    if (connState !== 'live') rejoin();
  });

  // ================= 波 =================
  function spawnRipple() {
    if (isScreen) return;
    var layer = $('rippleLayer');
    var btn = $('waveBtn');
    var zone = $('waveZone');
    if (!layer || !btn || !zone) return;
    while (layer.children.length >= 8) layer.removeChild(layer.firstChild);
    var br = btn.getBoundingClientRect();
    var zr = zone.getBoundingClientRect();
    var d = document.createElement('div');
    d.className = 'ripple';
    d.style.left = (br.left - zr.left + br.width / 2) + 'px';
    d.style.top = (br.top - zr.top + br.height / 2) + 'px';
    d.addEventListener('animationend', function () { d.remove(); });
    layer.appendChild(d);
  }

  function sendWave() {
    waveCount += 1;
    renderCounts();
    spawnRipple();
    vibrate(25);
    sendBroadcast('wave', { total: waveCount, from: deviceId, at: Date.now() });
  }

  function onWave(p) {
    if (!p) return;
    // 送信者の最新合計へ monotonic に寄せる（アプリと同じ）
    if (typeof p.total === 'number' && p.total > waveCount) waveCount = p.total;
    else waveCount += 1;
    renderCounts();
    if (p.from !== deviceId) {
      spawnRipple();
      remoteVibrate();
    }
  }

  // ================= 一言 =================
  function insertWord(w) {
    for (var i = 0; i < words.length; i++) {
      if (words[i].id === w.id) return false;
    }
    words.unshift(w);
    while (words.length > MAX_WORDS) words.pop();
    renderChips();
    return true;
  }

  function renderChips() {
    if (isScreen) return;
    var box = $('chips');
    if (!box) return;
    box.innerHTML = '';
    words.slice(0, VISIBLE_CHIPS).forEach(function (w, i) {
      var s = document.createElement('span');
      s.className = 'chip' + (w.mine ? ' mine' : '');
      if (w.name) {
        var n = document.createElement('span');
        n.className = 'chip-name';
        n.textContent = w.name;
        s.appendChild(n);
        var t = document.createElement('span');
        t.className = 'chip-text';
        t.textContent = w.text;
        s.appendChild(t);
      } else {
        s.textContent = w.text;
      }
      s.style.opacity = String(Math.max(0.35, 1 - i * 0.09));
      box.appendChild(s);
    });
  }

  function onWord(p) {
    if (!p || typeof p.text !== 'string' || !p.text.trim()) return;
    var from = typeof p.from === 'string' ? p.from : 'unknown';
    var id = typeof p.id === 'string' ? p.id : (from + '-' + (p.at != null ? p.at : Date.now()));
    // 名前が無い言葉（旧クライアント・Flutterアプリ）は従来表示のまま
    var name = (typeof p.name === 'string' && p.name.trim()) ? p.name.trim().slice(0, 12) : '';
    var w = { id: id, text: p.text.trim(), from: from, name: name, mine: from === deviceId };
    if (insertWord(w) && isScreen) spawnWallWord(w);
  }

  function persistWord(text) {
    if (!sb) return;
    var base = { room: CHANNEL_NAME, device_id: deviceId, body: text };
    var row = base;
    if (nickname) {
      row = { room: CHANNEL_NAME, device_id: deviceId, body: text, name: nickname };
    }
    try {
      Promise.resolve(sb.from('wave_words').insert(row)).then(function (res) {
        if (res && res.error && row !== base) {
          // name 列がまだ無いDBでは、名前なしで保存し直す
          try {
            Promise.resolve(sb.from('wave_words').insert(base)).catch(function () { /* noop */ });
          } catch (e) { /* noop */ }
        }
      }).catch(function () { /* DBに届かなくてもライブで成立 */ });
    } catch (e) { /* noop */ }
  }

  function sendWord(ev) {
    ev.preventDefault();
    var input = $('wordInput');
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    var id = deviceId + '-' + (wordSeq++);
    insertWord({ id: id, text: text, from: deviceId, name: nickname, mine: true });
    persistWord(text);                    // DB保存は fire-and-forget
    sendBroadcast('word', { text: text, from: deviceId, at: Date.now(), id: id, name: nickname });
  }

  function seedWordsFromDb() {
    if (!sb) return;
    function applyRows(rows) {
      var fresh = [];
      // 取得は新しい順 → 古い順に unshift して「新しい順」リストに正しく積む
      rows.slice().reverse().forEach(function (row) {
        if (!row || typeof row.body !== 'string' || !row.body.trim()) return;
        var dev = typeof row.device_id === 'string' ? row.device_id : 'unknown';
        var text = row.body.trim();
        // ライブで既に届いている同一の言葉は重ねない
        var dup = words.some(function (w) { return w.from === dev && w.text === text; });
        if (dup) return;
        var name = (typeof row.name === 'string' && row.name.trim()) ? row.name.trim().slice(0, 12) : '';
        var w = { id: 'db-' + row.id, text: text, from: dev, name: name, mine: dev === deviceId };
        if (insertWord(w)) fresh.push(w);
      });
      if (isScreen) {
        fresh.slice(-10).forEach(function (w, i) {
          setTimeout(function () { spawnWallWord(w); }, 350 * (i + 1));
        });
      }
    }
    function fetchSeed(withName) {
      var q;
      try {
        q = sb.from('wave_words')
          .select(withName ? 'id, device_id, body, name' : 'id, device_id, body')
          .eq('room', CHANNEL_NAME)
          .order('created_at', { ascending: false })
          .limit(MAX_WORDS);
      } catch (e) { return; }
      Promise.resolve(q).then(function (res) {
        if (res && res.error) {
          if (withName) fetchSeed(false);   // name 列がまだ無いDB向けフォールバック
          return;
        }
        applyRows((res && res.data) || []);
      }).catch(function () { /* 読めなくてもライブだけで成立 */ });
    }
    fetchSeed(true);
  }

  // ================= 写真 =================
  function publicPhotoUrl(path) {
    return SUPABASE_URL + '/storage/v1/object/public/' + PHOTOS_BUCKET + '/' + path;
  }

  function insertPhoto(p) {
    for (var i = 0; i < photos.length; i++) {
      if (photos[i].url === p.url) return false;   // URLで重複排除（自分の送信のエコー含む）
    }
    photos.unshift(p);
    while (photos.length > MAX_PHOTOS) photos.pop();
    renderPhotoStrip();
    return true;
  }

  function renderPhotoStrip() {
    if (isScreen) return;
    var strip = $('photosStrip');
    var row = $('photosRow');
    if (!strip || !row) return;
    var list = photos.slice(0, VISIBLE_PHOTO_THUMBS);
    strip.hidden = list.length === 0;
    row.innerHTML = '';
    list.forEach(function (p) {
      var img = document.createElement('img');
      img.className = 'photo-thumb' + (p.mine ? ' mine' : '');
      img.src = p.url;
      img.alt = '';
      img.onerror = function () { img.remove(); };
      row.appendChild(img);
    });
  }

  function onPhoto(p) {
    if (!p || typeof p.url !== 'string' || !p.url) return;
    var name = (typeof p.name === 'string' && p.name.trim()) ? p.name.trim().slice(0, 12) : '';
    var ph = {
      id: typeof p.id === 'string' ? p.id : p.url,
      url: p.url,
      name: name,
      mine: false
    };
    insertPhoto(ph);   // 写真はスクリーンには流さず、カード用に貯めるだけ
  }

  function seedPhotosFromDb() {
    if (!sb) return;
    var q;
    try {
      q = sb.from('wave_photos')
        .select('id, device_id, name, url')
        .eq('room', CHANNEL_NAME)
        .order('created_at', { ascending: false })
        .limit(MAX_PHOTOS);
    } catch (e) { return; }
    Promise.resolve(q).then(function (res) {
      if (res && res.error) return;
      var rows = (res && res.data) || [];
      // 古い順に処理して「新しい順」リストへ正しく積む
      rows.slice().reverse().forEach(function (row) {
        if (!row || typeof row.url !== 'string' || !row.url) return;
        var name = (typeof row.name === 'string' && row.name.trim()) ? row.name.trim().slice(0, 12) : '';
        var ph = {
          id: 'db-' + row.id,
          url: row.url,
          name: name,
          mine: row.device_id === deviceId
        };
        insertPhoto(ph);
      });
    }).catch(function () { /* 読めなくてもライブで成立 */ });
  }

  function persistPhoto(url) {
    if (!sb) return;
    var base = { room: CHANNEL_NAME, device_id: deviceId, url: url };
    var row = base;
    if (nickname) {
      row = { room: CHANNEL_NAME, device_id: deviceId, url: url, name: nickname };
    }
    try {
      Promise.resolve(sb.from('wave_photos').insert(row)).then(function (res) {
        if (res && res.error && row !== base) {
          try {
            Promise.resolve(sb.from('wave_photos').insert(base)).catch(function () { /* noop */ });
          } catch (e) { /* noop */ }
        }
      }).catch(function () { /* DBに届かなくてもライブで成立 */ });
    } catch (e) { /* noop */ }
  }

  function downscaleImage(file) {
    return new Promise(function (resolve) {
      var url;
      try { url = URL.createObjectURL(file); } catch (e) { resolve(null); return; }
      var img = new Image();
      img.onload = function () {
        try {
          var maxDim = 1280;
          var w = img.naturalWidth || 1;
          var h = img.naturalHeight || 1;
          var scale = Math.min(1, maxDim / Math.max(w, h));
          var canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(w * scale));
          canvas.height = Math.max(1, Math.round(h * scale));
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          if (canvas.toBlob) {
            canvas.toBlob(function (blob) { resolve(blob); }, 'image/jpeg', 0.82);
          } else {
            resolve(null);
          }
        } catch (e) { resolve(null); }
      };
      img.onerror = function () {
        try { URL.revokeObjectURL(url); } catch (e) { /* noop */ }
        resolve(null);
      };
      img.src = url;
    });
  }

  function setPhotoStatus(msg) {
    var el = $('photoStatus');
    if (el) el.textContent = msg || '';
  }

  function onPhotoPicked() {
    var input = $('photoInput');
    var file = input && input.files && input.files[0];
    if (input) input.value = '';      // 同じ写真を選び直せるようにリセット
    if (!file || !sb) return;
    setPhotoStatus('送信中…');
    downscaleImage(file).then(function (blob) {
      if (!blob) throw new Error('unreadable');
      var path = deviceId + '/' + Date.now() + '.jpg';
      return Promise.resolve(
        sb.storage.from(PHOTOS_BUCKET).upload(path, blob, { contentType: 'image/jpeg', upsert: false })
      ).then(function (res) {
        if (res && res.error) throw res.error;
        return publicPhotoUrl(path);
      });
    }).then(function (url) {
      var id = deviceId + '-ph' + (photoSeq++);
      insertPhoto({ id: id, url: url, name: nickname, mine: true });
      persistPhoto(url);               // DB保存は fire-and-forget
      sendBroadcast('photo', { url: url, name: nickname, id: id });
      setPhotoStatus('');
      vibrate(20);
    }).catch(function () {
      setPhotoStatus('送信できませんでした');
      setTimeout(function () { setPhotoStatus(''); }, 4000);
    });
  }

  // ================= スクリーンの言葉ウォール =================
  function spawnWallWord(w) {
    var wall = $('wordWall');
    if (!wall) return;
    var text = typeof w === 'string' ? w : (w && w.text) || '';
    var name = (w && typeof w === 'object' && typeof w.name === 'string') ? w.name : '';
    if (!text) return;
    while (wall.children.length >= 16) wall.removeChild(wall.firstChild);
    var d = document.createElement('div');
    d.className = 'wall-word' + (Math.random() < 0.4 ? ' white' : '');
    if (name) {
      var n = document.createElement('span');
      n.className = 'wall-name';
      n.textContent = name;
      d.appendChild(n);
      var t = document.createElement('span');
      t.textContent = text;
      d.appendChild(t);
    } else {
      d.textContent = text;
    }
    d.style.left = (6 + Math.random() * 86) + '%';
    d.style.top = (52 + Math.random() * 34) + '%';
    d.style.fontSize = (30 + Math.random() * 30) + 'px';
    d.addEventListener('animationend', function () { d.remove(); });
    wall.appendChild(d);
  }

  // ================= MCバナー =================
  function onMc(p) {
    if (!p || typeof p.body !== 'string' || !p.body) return;
    var titleEl = $('mcTitle');
    if (typeof p.title === 'string' && p.title) {
      titleEl.textContent = p.title;
      titleEl.hidden = false;
    } else {
      titleEl.hidden = true;
    }
    $('mcBody').textContent = p.body;
    $('mcBanner').hidden = false;
    if (mcTimer) clearTimeout(mcTimer);
    mcTimer = setTimeout(function () { $('mcBanner').hidden = true; }, 12000);
  }

  // ================= 封印（今すぐ開ける / 元日まで取っておく） =================
  function cardVisible() { return !$('artworkOverlay').hidden; }

  function onSealed(p) {
    if (!p) return;
    pendingSealed = {
      message: (typeof p.message === 'string' && p.message) ? p.message : '元日に開封されます',
      cardId: (typeof p.cardId === 'number') ? p.cardId : null
    };
    showSealedChoice();
  }

  function showSealedChoice() {
    if (!pendingSealed) return;
    if (cardVisible()) { updateSealedChip(); return; }   // カード表示中は邪魔しない
    $('sealedMessage').textContent = pendingSealed.message;
    $('sealedError').hidden = true;
    $('sealedOverlay').hidden = false;
    $('sealedChip').hidden = true;
    vibrate([20, 40, 20]);
  }

  function updateSealedChip() {
    $('sealedChip').hidden = !pendingSealed || cardVisible();
  }

  function openSealedNow() {
    if (!pendingSealed) return;
    var cardId = pendingSealed.cardId;
    if (cardId == null || !sb) {
      // id が無い封印は通常の到達チェック（open_at 経過分）に委ねる。
      // カードがまだ無ければチップに戻して封印状態を失わない。
      $('sealedOverlay').hidden = true;
      fetchCardFromDb();
      updateSealedChip();
      return;
    }
    fetchSealedCard(cardId, true);
  }

  function fetchSealedCard(cardId, withPhotos) {
    var q;
    try {
      q = sb.from('wave_cards')
        .select(withPhotos ? 'id, title, body, words, photos' : 'id, title, body, words')
        .eq('id', cardId).limit(1);
    } catch (e) { $('sealedError').hidden = false; return; }
    Promise.resolve(q).then(function (res) {
      if (res && res.error) {
        if (withPhotos) { fetchSealedCard(cardId, false); return; }  // photos 列が無いDB向け
        $('sealedError').hidden = false;
        return;
      }
      var rows = (res && res.data) || [];
      var row = rows[0];
      if (!row || typeof row.body !== 'string' || !row.body) {
        $('sealedError').hidden = false;
        return;
      }
      $('sealedOverlay').hidden = true;
      pendingSealed = null;
      updateSealedChip();
      showArtwork({
        title: typeof row.title === 'string' ? row.title : null,
        body: row.body,
        words: parseWords(row.words),
        photos: parsePhotos(row.photos),
        cardId: typeof row.id === 'number' ? row.id : cardId,
        imageUrl: null
      });
    }).catch(function () { $('sealedError').hidden = false; });
  }

  // ================= 年賀状カード =================
  function parseWords(raw) {
    if (Array.isArray(raw)) {
      var out = raw.filter(function (w) { return typeof w === 'string' && w.trim(); }).slice(0, 60);
      if (out.length) return out;
    }
    // ペイロードに言葉一覧が無ければ、この端末が集めた言葉で代用（アプリと同じ）
    return words.map(function (w) { return w.text; }).slice(0, 60);
  }

  function parsePhotos(raw) {
    if (!Array.isArray(raw)) return [];
    return raw.filter(function (u) { return typeof u === 'string' && u; }).slice(0, 6);
  }

  function onArtwork(p) {
    if (!p || typeof p.body !== 'string' || !p.body) return;
    showArtwork({
      title: typeof p.title === 'string' ? p.title : null,
      body: p.body,
      words: parseWords(p.words),
      photos: parsePhotos(p.photos),
      cardId: typeof p.id === 'number' ? p.id : null,
      imageUrl: typeof p.imageUrl === 'string' ? p.imageUrl : null
    });
  }

  function fetchCardFromDb() { fetchCardFromDbCols(true); }

  function fetchCardFromDbCols(withPhotos) {
    if (!sb) return;
    var q;
    try {
      q = sb.from('wave_cards')
        .select(withPhotos ? 'id, title, body, words, photos' : 'id, title, body, words')
        .eq('room', CHANNEL_NAME)
        .lte('open_at', new Date().toISOString())
        .order('created_at', { ascending: false })
        .limit(1);
    } catch (e) { return; }
    Promise.resolve(q).then(function (res) {
      if (res && res.error) {
        if (withPhotos) fetchCardFromDbCols(false);   // photos 列が無いDB向けフォールバック
        return;
      }
      var rows = (res && res.data) || [];
      var row = rows[0];
      if (!row || typeof row.id !== 'number') return;
      if (row.id === shownCardId) return;                       // 表示済みは二度開かない
      if (currentCard && currentCard.cardId === row.id) return; // 表示中も同じ
      if (typeof row.body !== 'string' || !row.body) return;
      showArtwork({
        title: typeof row.title === 'string' ? row.title : null,
        body: row.body,
        words: parseWords(row.words),
        photos: parsePhotos(row.photos),
        cardId: row.id,
        imageUrl: null
      });
    }).catch(function () { /* 読めなくてもライブ経路が残っている */ });
  }

  function spawnParticles(n) {
    var box = $('particles');
    if (!box) return;
    box.innerHTML = '';
    for (var i = 0; i < n; i++) {
      var s = document.createElement('span');
      s.className = 'particle';
      var size = 3 + Math.random() * 5;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = (6 + Math.random() * 88) + '%';
      s.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
      s.style.animationDuration = (1.7 + Math.random() * 1.5) + 's';
      s.style.animationDelay = (Math.random() * 0.5) + 's';
      box.appendChild(s);
    }
    setTimeout(function () { box.innerHTML = ''; }, 4200);
  }

  function showArtwork(card) {
    currentCard = card;
    if (card.cardId != null) shownCardId = card.cardId;
    // 開封されたので封印状態は解ける（アプリと同じ）
    pendingSealed = null;
    $('sealedOverlay').hidden = true;
    $('sealedChip').hidden = true;

    // カード面を組み立てる
    var img = $('cardImage');
    img.onerror = function () { img.hidden = true; };
    var imgSrc = card.imageUrl || DEFAULT_CARD_IMAGE;   // 指定が無ければ定番の干支絵
    if (imgSrc) {
      img.src = imgSrc;
      img.hidden = false;
    } else {
      img.hidden = true;
      img.removeAttribute('src');
    }
    // みんなの写真ストリップ（無ければ従来どおり非表示）
    var pbox = $('cardPhotos');
    pbox.innerHTML = '';
    var cps = card.photos || [];
    cps.slice(0, 6).forEach(function (u) {
      var im = document.createElement('img');
      im.src = u;
      im.alt = '';
      im.onerror = function () { im.remove(); };
      pbox.appendChild(im);
    });
    pbox.hidden = cps.length === 0;
    var titleEl = $('cardTitle');
    if (card.title) { titleEl.textContent = card.title; titleEl.hidden = false; }
    else { titleEl.hidden = true; }
    $('cardBody').textContent = card.body;
    var wbox = $('cardWords');
    wbox.innerHTML = '';
    card.words.forEach(function (t) {
      var s = document.createElement('span');
      s.textContent = t;
      wbox.appendChild(s);
    });
    $('cardWordsLabel').hidden = card.words.length === 0;
    $('postcard').scrollTop = 0;

    // 配達演出スタート
    var ov = $('artworkOverlay');
    ov.classList.remove('delivered');
    ov.classList.remove('playing');
    ov.hidden = false;
    delivered = false;
    canDismissCard = false;
    $('cardHint').hidden = true;
    void ov.offsetWidth;                 // アニメーションを確実に先頭から再生
    ov.classList.add('playing');
    spawnParticles(isScreen ? 26 : 16);
    vibrate([30, 50, 30]);
    if (deliveryTimer) clearTimeout(deliveryTimer);
    deliveryTimer = setTimeout(finishDelivery, 3450);
  }

  function finishDelivery() {
    if (delivered) return;
    delivered = true;
    canDismissCard = true;
    $('artworkOverlay').classList.add('delivered');
    $('cardHint').hidden = false;
    if (deliveryTimer) { clearTimeout(deliveryTimer); deliveryTimer = null; }
  }

  function onArtworkOverlayClick() {
    if (!delivered) { finishDelivery(); return; }   // 演出中タップ = スキップ
    if (canDismissCard) {
      var ov = $('artworkOverlay');
      ov.hidden = true;
      ov.classList.remove('playing');
      ov.classList.remove('delivered');
      currentCard = null;
      updateSealedChip();
    }
  }

  // ================= ニックネームUI（参加者モードのみ） =================
  function renderNick() {
    if (isScreen) return;
    if (nickname) {
      $('nickGate').hidden = true;
      $('nickBar').hidden = false;
      $('nickNameEl').textContent = nickname;
    } else {
      $('nickGate').hidden = false;
      $('nickBar').hidden = true;
    }
  }

  function saveNickname(ev) {
    ev.preventDefault();
    var v = $('nickInput').value.trim().slice(0, 12);
    if (!v) return;
    nickname = v;
    try { localStorage.setItem(NICK_KEY, v); } catch (e) { /* noop */ }
    renderNick();
    trackPresence();                       // Presence のペイロードにも新しい名前を反映
  }

  function editNickname() {
    if (isScreen) return;
    $('nickInput').value = nickname;
    $('nickGate').hidden = false;
    $('nickBar').hidden = true;
    try { $('nickInput').focus(); } catch (e) { /* noop */ }
  }

  // ================= 進行パネル（スクリーンモード） =================
  function setPanelHint(msg) {
    var el = $('panelHint');
    if (el) el.textContent = msg || '';
  }

  function fetchNewestCard(withPhotos) {
    if (!sb) return Promise.resolve(null);
    var q;
    try {
      q = sb.from('wave_cards')
        .select(withPhotos ? 'id, title, body, words, photos' : 'id, title, body, words')
        .eq('room', CHANNEL_NAME)
        .order('created_at', { ascending: false })
        .limit(1);
    } catch (e) { return Promise.resolve(null); }
    return Promise.resolve(q).then(function (res) {
      if (res && res.error) {
        if (withPhotos) return fetchNewestCard(false);   // photos 列が無いDB向けフォールバック
        return null;
      }
      var rows = (res && res.data) || [];
      return rows[0] || null;
    }).catch(function () { return null; });
  }

  function panelSendMc() {
    var input = $('mcInput');
    var text = (input.value || '').trim();
    if (!text) return;
    input.value = '';
    sendBroadcast('mc', { title: 'AI MC', body: text });
    setPanelHint('お知らせを送りました');
  }

  function panelSeal() {
    fetchNewestCard(true).then(function (row) {
      if (!row || typeof row.id !== 'number') {
        setPanelHint('年賀状がまだありません');
        return;
      }
      sendBroadcast('sealed', { message: '元日に開封されます', cardId: row.id });
      setPanelHint('封をしました');
    });
  }

  function panelReveal() {
    fetchNewestCard(true).then(function (row) {
      if (!row || typeof row.body !== 'string' || !row.body) {
        setPanelHint('年賀状がまだありません');
        return;
      }
      sendBroadcast('artwork', {
        id: typeof row.id === 'number' ? row.id : null,
        title: typeof row.title === 'string' ? row.title : null,
        body: row.body,
        words: Array.isArray(row.words) ? row.words : [],
        photos: parsePhotos(row.photos)
      });
      setPanelHint('開封しました');
    });
  }

  // ================= QRコード（スクリーンモード） =================
  function setupQr() {
    if (!isScreen) return;
    var u = new URL(location.href);
    u.searchParams.delete('screen');       // スマホは参加者モードで開く
    var url = u.toString();
    $('qrUrl').textContent = url;
    if (window.QRCode) {
      new QRCode($('qrBox'), { text: url, width: 176, height: 176, correctLevel: QRCode.CorrectLevel.M });
    } else {
      $('qrBox').textContent = url;        // ライブラリが読めなければURL文字列で代替
    }
  }

  // ================= 初期化 =================
  function init() {
    // 宴会名（PARTY_NAME）を各所へ反映
    $('partyLine').textContent = PARTY_NAME;
    $('screenTitle').textContent = PARTY_NAME;
    $('cardFoot').textContent = PARTY_NAME + ' — WAVE';
    try {
      var mu = new URL(location.href);
      mu.searchParams.set('screen', '1');
      $('masterLink').href = mu.toString();   // マスター画面（?screen=1）へのリンク
    } catch (e) { /* href="?screen=1" のフォールバックのまま */ }
    renderNick();

    setupQr();
    if (!configBad) {
      try {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      } catch (e) { sb = null; }
    }
    if (sb) {
      joinRoom();
      seedWordsFromDb();
      seedPhotosFromDb();
      fetchCardFromDb();
    } else {
      setConn('reconnecting');
    }

    $('waveBtn').addEventListener('click', sendWave);
    $('wordBar').addEventListener('submit', sendWord);
    $('photoBtn').addEventListener('click', function () { $('photoInput').click(); });
    $('photoInput').addEventListener('change', onPhotoPicked);
    $('opsToggle').addEventListener('click', function () {
      var p = $('opsPanel');
      p.hidden = !p.hidden;
    });
    $('mcSendBtn').addEventListener('click', panelSendMc);
    $('mcInput').addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); panelSendMc(); }
    });
    $('sealBtn').addEventListener('click', panelSeal);
    $('revealBtn').addEventListener('click', panelReveal);
    $('nickForm').addEventListener('submit', saveNickname);
    $('nickChange').addEventListener('click', editNickname);
    $('mcClose').addEventListener('click', function () {
      $('mcBanner').hidden = true;
      if (mcTimer) clearTimeout(mcTimer);
    });
    $('sealedOpenBtn').addEventListener('click', openSealedNow);
    $('sealedKeepBtn').addEventListener('click', function () {
      $('sealedOverlay').hidden = true;
      updateSealedChip();                  // 金チップに畳む（タップで選択画面に戻れる）
    });
    $('sealedChip').addEventListener('click', showSealedChoice);
    $('artworkOverlay').addEventListener('click', onArtworkOverlayClick);

    renderChips();
    renderCounts();
  }

  init();
})();
</script>
</body>
</html>
